  </div>

  <div class="top-bar">
    <span>✍️ jammy0903님 환영합니다</span>
    <button class="btn-logout" onclick="doLogout()">로그아웃</button>
  </div>

  <!-- 포스트 정보 -->
  <div class="write-section">
    <h5>📋 포스트 정보</h5>

      <label class="form-label">제목 <span class="required-star">*</span></label>
      <input type="text" id="post-title" class="form-control form-control-lg"
        placeholder="포스트 제목을 입력하세요" oninput="updateSlugPreview()">
      <div class="slug-preview" id="slug-preview"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">부제목 <small style="font-weight:normal;color:#9b8e9e;">(선택)</small></label>
      <input type="text" id="post-subtitle" class="form-control" placeholder="부제목">
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">날짜</label>

      </div>

        <input type="text" id="post-categories" class="form-control" value="blog">

        <label class="form-label">태그 <small style="font-weight:normal;color:#9b8e9e;">(쉼표 구분)</small></label>
        <input type="text" id="post-tags" class="form-control" placeholder="python, linux">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
<script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>

<script>
const REPO_OWNER  = 'jammy0903';
const REPO_NAME   = 'jammy0903.github.io';
const BRANCH      = 'main';
const GH_TOKEN    = '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';
const STORAGE_KEY   = 'blog_pw_v2';
const SESSION_KEY   = 'blog_session_v2';
const SESSION_TTL   = 60 * 60 * 1000; // 1시간

let easyMDE = null;

/* ── SHA-256 ── */
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

/* ── 화면 초기화 ── */
document.addEventListener('DOMContentLoaded', () => {
  const session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
  if (session && Date.now() - session.ts < SESSION_TTL) {
    showWriteScreen();
    return;
  }
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) {
    document.getElementById('first-setup-hint').style.display = 'block';
  }
});

/* ── 로그인 ── */
async function doLogin() {
  const pw = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');

  if (!pw) { errEl.textContent = '비밀번호를 입력해주세요.'; return; }

  const hash = await sha256(pw);
  const saved = localStorage.getItem(STORAGE_KEY);

  if (!saved) {
    /* 첫 방문: 입력한 비밀번호를 그대로 설정 */
    localStorage.setItem(STORAGE_KEY, hash);
    localStorage.setItem(SESSION_KEY, JSON.stringify({ ts: Date.now() }));
    errEl.textContent = '';
    showWriteScreen();
  } else if (hash === saved) {
    localStorage.setItem(SESSION_KEY, JSON.stringify({ ts: Date.now() }));
    errEl.textContent = '';
    showWriteScreen();
  } else {
    errEl.textContent = '비밀번호가 틀렸습니다.';
  }
}

/* ── Enter 키 ── */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') {
    doLogin();
  }
});

/* ── 에디터 화면 ── */
function showWriteScreen() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('write-screen').style.display = 'block';

  document.getElementById('post-date').value = new Date().toISOString().split('T')[0];
  updateSlugPreview();

  if (!easyMDE) {
    easyMDE = new EasyMDE({
      element: document.getElementById('post-content'),
      placeholder: '여기에 마크다운으로 내용을 작성하세요...\n\n## 소제목\n\n본문 내용\n\n```python\nprint("Hello!")\n```',
      spellChecker: false,
      autosave: { enabled: true, uniqueId: 'jammy-blog-autosave', delay: 3000 },
      toolbar: [
        'bold','italic','strikethrough','heading','|',
        'quote','code','unordered-list','ordered-list','|',
        'link','image','table','horizontal-rule','|',
        'preview','side-by-side','fullscreen','|','guide'
      ],
    });
  }
}

/* ── 로그아웃 ── */
function doLogout() {
  localStorage.removeItem(SESSION_KEY);
  document.getElementById('write-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('login-password').value = '';
}

/* ── 슬러그 ── */
function slugify(text) {
  return text.trim()
    .replace(/[\s·]+/g, '-')
    .replace(/[<>:"\/\\|?*\x00-\x1f]/g, '')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '')
    .substring(0, 80);
}

function updateSlugPreview() {
  const title = document.getElementById('post-title')?.value ?? '';
  const date  = document.getElementById('post-date')?.value  ?? '';
  const el    = document.getElementById('slug-preview');
  if (!el || !title.trim()) { if (el) el.textContent = ''; return; }
  el.textContent = '파일명: _posts/' + date + '-' + slugify(title) + '.md';
}

/* ── Front Matter ── */
function buildFrontMatter() {
  const title      = document.getElementById('post-title').value.trim();
  const subtitle   = document.getElementById('post-subtitle').value.trim();
  const date       = document.getElementById('post-date').value;
  const categories = document.getElementById('post-categories').value.trim() || 'blog';
  const tagsRaw    = document.getElementById('post-tags').value.trim();
  const tags       = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];

  let fm = '---\n';
  fm += 'layout: post\n';
  fm += 'title: "' + title.replace(/\\/g,'\\\\').replace(/"/g,'\\"') + '"\n';
  if (subtitle) fm += 'subtitle: "' + subtitle.replace(/\\/g,'\\\\').replace(/"/g,'\\"') + '"\n';
  fm += 'date: ' + date + ' 12:00:00 +0900\n';
  fm += 'categories: ' + categories + '\n';
  if (tags.length > 0) fm += 'tags: [' + tags.map(t => "'" + t + "'").join(', ') + ']\n';
  fm += '---\n\n';
  return fm;
}

/* ── 발행 ── */
async function submitPost() {
  const title = document.getElementById('post-title').value.trim();
  if (!title) { showStatus('danger', '제목을 입력해주세요.'); return; }

  const content = easyMDE.value().trim();
  if (!content) { showStatus('danger', '내용을 입력해주세요.'); return; }

  const date     = document.getElementById('post-date').value;
  const filename = '_posts/' + date + '-' + slugify(title) + '.md';
  const fullText = buildFrontMatter() + content;
  const encoded  = btoa(unescape(encodeURIComponent(fullText)));

  showStatus('info', '⏳ 발행 중...');

  try {
    const res = await fetch(
      'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + encodeURIComponent(filename),
      {
        method: 'PUT',
        headers: {
          'Authorization': 'token ' + GH_TOKEN,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github+json',
        },
        body: JSON.stringify({ message: 'Add post: ' + title, content: encoded, branch: BRANCH }),
      }
    );
    const data = await res.json();
    if (res.ok) {
      showStatus('success',
        '✅ 발행 완료! <a href="' + data.content.html_url + '" target="_blank">GitHub에서 보기 →</a><br>' +
        '<small>1~2분 후 블로그에 반영됩니다.</small>'
      );
    } else if (res.status === 422) {
      showStatus('danger', '❌ 같은 파일명이 이미 존재합니다. 제목을 조금 바꿔보세요.<br><code>' + filename + '</code>');
    } else if (res.status === 401) {
      showStatus('danger', '❌ 인증 실패 — 토큰이 만료됐습니다. 새 토큰으로 교체가 필요합니다.');
    } else {
      showStatus('danger', '❌ 오류 (' + res.status + '): ' + data.message);
    }
  } catch(e) {
    showStatus('danger', '❌ 네트워크 오류: ' + e.message);
  }
}

function showStatus(type, message) {
  const el = document.getElementById('status-message');
  el.className = 'alert alert-' + type;
  el.innerHTML = message;
  el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
</script>

{% if page.comments %}
<!-- Waline: Comments & Reactions -->
<link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />

<style>
  /* Waline - Dusty Rose 팔레트 맞춤 */
  #waline-section {
    max-width: 800px;
    margin: 3rem auto 2rem;
    padding: 0 1.5rem;
  }

  #waline-section h3 {
    font-family: 'Playfair Display', 'Nanum Myeongjo', Georgia, serif;
    font-size: 1.2rem;
    color: #6B5E6E;
    margin-bottom: 1.5rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid #F0E6EB;
  }

  :root {
    --waline-theme-color: #C4727F;
    --waline-active-color: #A85B6A;
    --waline-bgcolor: #FFFAF9;
    --waline-bgcolor-light: #FAF5F7;
    --waline-bgcolor-hover: #F5EEF1;
    --waline-border-color: #F0E6EB;
    --waline-color: #4A4453;
    --waline-color-light: #9B8E9E;
    --waline-font-size: 0.95rem;
    --waline-border: 1px solid var(--waline-border-color);
    --waline-avatar-size: 2.2rem;
    --waline-m-avatar-size: 1.8rem;
  }

  .wl-btn {
    border-radius: 6px !important;
    font-family: 'Lora', 'Noto Serif KR', Georgia, serif !important;
  }

  .wl-editor {
    font-family: 'Lora', 'Noto Serif KR', Georgia, serif !important;
    font-size: 0.9rem !important;
  }

  .wl-reaction-list {
    gap: 0.5rem !important;
  }

  .wl-reaction-item {
    border-radius: 8px !important;
    border: 1px solid var(--waline-border-color) !important;
    padding: 0.4rem 0.8rem !important;
    transition: all 0.2s ease !important;
  }

  .wl-reaction-item:hover,
  .wl-reaction-item.active {
    background: #F5EEF1 !important;
    border-color: #C4727F !important;
  }
</style>

<div id="waline-section">
  <h3>댓글</h3>
  <div id="waline"></div>
</div>

<script type="module">
  import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';

  init({
    el: '#waline',
    serverURL: '{{ site.waline_server_url }}',
    lang: 'ko',
    reaction: ['👍', '❤️', '🎉', '🤔', '😮'],
    login: 'enable',
    meta: ['nick', 'mail'],
    requiredMeta: [],
    wordLimit: 0,
    pageSize: 10,
    comment: true,
    copyright: false,
    locale: {
      placeholder: '댓글을 남겨주세요. 익명도 가능합니다 :)',
      reactionTitle: '이 글이 도움이 됐나요?',
      submit: '등록',
      nick: '이름 (선택)',
      mail: '이메일 (선택)',
      nickError: '닉네임이 너무 짧아요',
      mailError: '올바른 이메일을 입력해주세요',
    },
  });
</script>
{% endif %}
